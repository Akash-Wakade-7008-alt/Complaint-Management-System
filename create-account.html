<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="create-account.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">
        <span class="logo-icon">
          <img src="./pg-logo.png" alt="Pg-logo" style="height: 8vh" />
        </span>
        <span class="logo-text">Trident PG Complaints</span>
      </div>
    </header>

    <main class="container">
      <div class="card">
        <div class="icon-box">
          <img src="./pg-logo.png" alt="Pg-logo" style="height: 8vh" />
        </div>

        <h2>Create Account</h2>
        <p class="subtitle">Register to start managing your complaints</p>

        <form id="registerForm" novalidate>
          <label for="fullName">Full Name</label>
          <input
            id="fullName"
            name="fullName"
            type="text"
            placeholder="Your Name"
            required
          />

          <label for="email">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          />

          <label for="room">Room Number</label>
          <input
            id="room"
            name="room"
            type="text"
            placeholder="e.g., A-101"
            required
          />

          <label for="password">Password</label>
          <div class="password-box">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Create a password"
              required
              minlength="6"
            />
            <button
              type="button"
              class="eye"
              id="togglePassword"
              aria-label="Show/Hide Password"
            >
              👁
            </button>
          </div>

          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            placeholder="Confirm your password"
            required
            minlength="6"
          />

          <div class="terms">
            <input type="checkbox" id="terms" required />
            <label for="terms">
              I agree to the
              <a href="#">Terms of Service</a>
              and
              <a href="#">Privacy Policy</a>
            </label>
          </div>

          <p id="errorMsg" class="error-msg" aria-live="polite"></p>

          <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="signin-text">
          Already have an account?
          <a href="#">Sign in</a>
        </p>
      </div>
    </main>

    <script src="create-account.js"></script>
  </body>
</html>
