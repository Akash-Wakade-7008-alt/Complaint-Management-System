<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PG Complaints | Register</title>
    <link rel="stylesheet" href="create-account.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">
        <span class="logo-icon">
            <img src="pg logo.png" alt="Pg-logo" style="height: 8vh;">
        </span>
        <span class="logo-text">Trident PG Complaints</span>
    </div>
</header>

<main class="container">
    <div class="card">
        <div class="icon-box">
            <img src="pg logo.png" alt="Pg-logo" style="height: 8vh;">
        </div>
        <h2>Create Account</h2>
        <p class="subtitle">Register to start managing your complaints</p>

        <form>
            <label>Full Name</label>
            <input type="text" placeholder="Your Name">

            <label>Email Address</label>
            <input type="email" placeholder="you@example.com">

            <label>Room Number</label>
            <input type="text" placeholder="e.g., A-101">

            <label>Password</label>
            <div class="password-box">
                <input type="password" placeholder="Create a password">
                <span class="eye">👁</span>
            </div>

            <label>Confirm Password</label>
            <input type="password" placeholder="Confirm your password">

            
            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">
                    I agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>
                </label>
            </div>

            
           <a href="main-interface.html" target="_blank" style="text-decoration: none;cursor: pointer;">
             <div class="btn-primary">
                <p style="margin-left: 7vw;">Create Account</p>
            </div>
           </a>
        </form>

        
        <p class="signin-text">
            Already have an account?
            <a href="#">Sign in</a>
        </p>
    </div>
</main>

</body>
</html>
