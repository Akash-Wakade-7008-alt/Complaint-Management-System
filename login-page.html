<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <link rel="stylesheet" href="login-page.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">
        <div class="logo-icon">
            <img src="pg logo.png" alt="Pg-logo" style="height: 8vh;">
        </div>
        <span>Trident PG Complaints</span>
    </div>
</header>

<main class="container">
    <div class="card">

        <div class="icon-box">
            <img src="pg logo.png" alt="Pg-log" style="height: 8vh;">
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

       <form id="loginForm">
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Enter your email" required />

  <label for="password">Password</label>
  <div class="password-box">
    <input type="password" id="password" placeholder="Enter password" required />
    <span class="eye">👁</span>
  </div>


  <p id="emailError" style="color: red; font-size: 13px; margin-top: 8px; display: none;">
    Please enter a valid email address.
  </p>
  <button type="submit" class="btn-primary" id="signInBtn">Sign In</button>
</form>

        <p class="signup">
            Don't have an account?
            <a href="#">Create one</a>
        </p>

        <div class="demo-box">
            <strong>Demo:</strong> Use any email to login as user, or
            <strong>"admin@pg.com"</strong> to login as admin
        </div>

    </div>
</main>


<script>
    const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const emailError = document.getElementById("emailError");

function isValidEmail(email) {
  const pattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  return pattern.test(email);
}

loginForm.addEventListener("submit", function (e) {
  e.preventDefault(); // stop default submit

  const email = emailInput.value.trim();

  if (!isValidEmail(email)) {
    emailError.style.display = "block";
    emailInput.style.borderColor = "red";
    return; // ❌ don't go next page
  }

  // ✅ valid email -> go to next page
  emailError.style.display = "none";
  emailInput.style.borderColor = "#d1d5db";

  window.location.href = "main-interface.html";
});
</script>


</body>
</html>
