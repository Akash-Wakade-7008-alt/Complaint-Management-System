<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PG Complaints | Login</title>
    <link rel="stylesheet" href="login-page.css">
</head>
<body>

<header class="top-bar">
    <div class="logo">
        <div class="logo-icon">
            <img src="pg logo.png" alt="Pg-logo" style="height: 8vh;">
        </div>
        <span>Trident PG Complaints</span>
    </div>
</header>

<main class="container">
    <div class="card">

        <div class="icon-box">
            <img src="pg logo.png" alt="Pg-log" style="height: 8vh;">
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <form>
            <label>Email Address</label>
            <input type="email" placeholder="you@example.com">

            <label>Password</label>
            <div class="password-box">
                <input type="password" placeholder="Enter your password">
                <span class="eye">👁</span>
            </div>

            <div class="options">
                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

           <a href="main-interface.html" target="_blank" style="text-decoration: none;">
             <div class="btn-primary">
               <p style="margin-left: 8.5vw;">Sign In</p> 
            </div>
           </a>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="#">Create one</a>
        </p>

        <div class="demo-box">
            <strong>Demo:</strong> Use any email to login as user, or
            <strong>"admin@pg.com"</strong> to login as admin
        </div>

    </div>
</main>

</body>
</html>
