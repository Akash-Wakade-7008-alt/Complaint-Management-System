<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complaint Form</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="query-form.css" />
  </head>
  <body>
    <header>
      <img
        src="images/pg logo.png"
        alt="Pg-logo"
        style="height: 8vh; margin-top: 1vh; margin-left: 1vw"
      />
      <h2 style="margin-left: 1vw; margin-top: 2.7vh">Trident PG Complaint</h2>
      <img
        src="images/notification-img.png"
        alt="notification-img"
        style="
          height: 6vh;
          margin-left: 70vw;
          margin-top: 0.7vh;
          cursor: pointer;
        "
      />
    </header>

    <main>
      <div
        class="section-1"
        style="flex: 1; margin-top: 7vh; height: 90vh; overflow-y: hidden"
      >
        <a
          href="main-interface.html"
          target="_blank"
          style="text-decoration: none"
        >
          <div class="dashboard">
            <img
              src="images/dashboard-img.png"
              alt="dashboard"
              id="dashboard-img"
            />
            <p style="margin-top: 3vh; margin-left: 0.5vw; font-size: large">
              Dashboard
            </p>
          </div>
        </a>

        <div class="Raise-Complaint">
          <img
            src="images/Raise-Complaint-Blue.png"
            alt="Raise-Complaint"
            id="Raise-Complaint-img"
          />
          <p style="margin-top: 1.5vh; margin-left: 0.3vw; font-size: large">
            Raise Complaint
          </p>
        </div>

        <a href="my-complaints.html" class="My-Complaint" target="_blank">
          <img
            src="images/my-complaint-img.png"
            alt="My-Complaint"
            id="My-Complaint-img"
          />
          <p style="margin-top: 3vh; margin-left: 0.5vw; font-size: large">
            My Complaint
          </p>
        </a>

        <div style="display: flex; margin-top: 46vh; margin-left: 2vw">
          <img src="images/Resident.png" alt="Resident" class="Resident-img" />
          <div>
            <p
              style="
                font-size: 12px;
                height: 2px;
                margin-top: 5vh;
                margin-left: 1vw;
              "
            >
              Yash
            </p>
            <p style="font-size: 12px; margin-left: 1vw; margin-top: 2vh">
              resident
            </p>
          </div>
        </div>

        <a
          href="index.html"
          target="_blank"
          style="text-decoration: none; color: black"
        >
          <div style="display: flex; margin-left: 1vw">
            <img
              src="images/Logout.png"
              alt="log-out"
              class="log-out"
              style="margin-left: 0.5vw"
            />
            <p style="font-size: small; margin-top: 3vh">Logout</p>
          </div>
        </a>
      </div>

      <div class="section-2" style="flex: 3; overflow-y: auto; height: 98vh">
        <a
          href="my-complaints.html"
          target="_blank"
          style="text-decoration: none; color: black"
        >
          <div class="topbar">
            <span>← Back</span>
          </div>
        </a>

        <div class="form-card">
          <h1>Raise a Complaint</h1>
          <p class="subtitle">
            Fill out the form below to submit your complaint
          </p>

          <form id="complaintForm" novalidate>
            <label for="category">Category *</label>
            <select id="category" required>
              <option value="" selected disabled>Select a category</option>
              <option value="Food">Food</option>
              <option value="Cleaning">Cleaning</option>
              <option value="Electricity">Electricity</option>
              <option value="Water">Water</option>
              <option value="Internet">Internet</option>
              <option value="Other">Other</option>
            </select>

            <label for="title">Complaint Title *</label>
            <input
              id="title"
              type="text"
              placeholder="Brief title for your complaint"
              required
            />

            <label for="desc">Description *</label>
            <textarea
              id="desc"
              placeholder="Describe your issue in detail..."
              required
            ></textarea>

            <label>Attach Image (Optional)</label>

            <input
              id="imageInput"
              type="file"
              accept="image/png, image/jpeg"
              hidden
            />

            <div id="uploadBox" class="upload-box" role="button" tabindex="0">
              <div>
                Click to upload or drag and drop<br />
                <small>PNG, JPG up to 5MB</small>
              </div>
              <div id="fileInfo" class="file-info"></div>
            </div>

            <p id="errorMsg" class="error-msg"></p>

            <div class="buttons">
              <button type="button" class="cancel" id="cancelBtn">
                Cancel
              </button>
              <button type="submit" class="submit">Submit Complaint</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="query-form.js"></script>
  </body>
</html>
